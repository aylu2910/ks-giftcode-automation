# H2 - Docker volume path
spring.datasource.url=jdbc:h2:file:/app/data/kingshot-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

# Gift Code API
kingshot.api.gift-codes-url=https://kingshot.net/api/gift-codes

# Player Info API
kingshot.api.player-info-url=https://kingshot.net/api/player-info

# Scheduler
kingshot.scheduler.cron=0 */5 * * * *

# Retry config
kingshot.retry.max-attempts=3
kingshot.retry.initial-delay-ms=2000
kingshot.retry.backoff-multiplier=2

# Worker config
kingshot.automation.workers=10

# Playwright timeout ms
kingshot.automation.timeout-ms=5000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Loki - Docker service name
logging.loki.url=http://loki:3100/loki/api/v1/push