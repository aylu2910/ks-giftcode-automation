spring.application.name=ks-giftcode-automation

# H2 - local path for development
spring.datasource.url=jdbc:h2:file:./data/kingshot-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Gift Code API
kingshot.api.gift-codes-url=https://kingshot.net/api/gift-codes

# Scheduler
kingshot.scheduler.cron=0 */3 * * * *

logging.loki.enabled=false
logging.loki.url=http://localhost:3100/loki/api/v1/push

# Retry config
kingshot.retry.max-attempts=3
kingshot.retry.initial-delay-ms=2000
kingshot.retry.backoff-multiplier=2

# Worker config
kingshot.automation.workers=10

# Playwright timeout ms
kingshot.automation.timeout-ms=5000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true