spring.application.name=ks-giftcode-automation

# H2 - local path for development
spring.datasource.url=jdbc:h2:file:./data/kingshot-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Gift Code API
kingshot.api.gift-codes-url=https://kingshot.net/api/gift-codes

# Player Info API
kingshot.api.player-info-url=https://kingshot.net/api/player-info

# Scheduler
kingshot.scheduler.cron=0 */5 * * * *

# Retry config
kingshot.retry.max-attempts=3
kingshot.retry.initial-delay-ms=2000
kingshot.retry.backoff-multiplier=2

# Worker config
kingshot.automation.workers=10

# Playwright timeout ms
kingshot.automation.timeout-ms=5000